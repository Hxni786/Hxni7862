<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="auto">
  <defs>
    <!-- Sphere Gradient -->
    <radialGradient id="sphereCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c2b22" />
      <stop offset="30%" stop-color="#0a120e" />
      <stop offset="75%" stop-color="#040705" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Core Glow -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00c8ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00c8ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00ff9c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes corePulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes driftDust {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    .pulse-glow {
      transform-origin: 250px 250px;
      animation: corePulse 3.5s ease-in-out infinite;
    }
    .dust {
      transform-origin: 250px 250px;
      animation: driftDust 8s linear infinite;
    }
    .mono-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      letter-spacing: 2px;
      fill: #00ff9c;
      opacity: 0.75;
    }
  </style>

  <!-- Background Void Canvas -->
  <rect width="500" height="500" fill="#030303" rx="16" />
  
  <!-- Outer Target Reticle -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#0e1712" stroke-width="1" stroke-dasharray="4,8" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="#00ff9c" stroke-width="0.75" opacity="0.15" />

  <!-- Coordinates / HUD Ticks -->
  <line x1="250" y1="15" x2="250" y2="30" stroke="#00ff9c" stroke-width="1.5" opacity="0.6" />
  <line x1="250" y1="470" x2="250" y2="485" stroke="#00ff9c" stroke-width="1.5" opacity="0.6" />
  <line x1="15" y1="250" x2="30" y2="250" stroke="#00ff9c" stroke-width="1.5" opacity="0.6" />
  <line x1="470" y1="250" x2="485" y2="250" stroke="#00ff9c" stroke-width="1.5" opacity="0.6" />

  <text x="35" y="45" class="mono-label">CIPHER_CORE // 0x786</text>
  <text x="340" y="45" class="mono-label">STATE: SYNCHRONIZED</text>

  <!-- Ambient Core Aura -->
  <circle cx="250" cy="250" r="140" fill="url(#coreAura)" class="pulse-glow" />

  <!-- Orbital Ring 1: Primary Emerald Ring (Rotates 360 deg) -->
  <g transform="translate(250, 250)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="185" ry="65" fill="none" stroke="url(#ringGrad1)" stroke-width="1.8" />
      <circle cx="185" cy="0" r="3.5" fill="#00ff9c" />
      <circle cx="-185" cy="0" r="2" fill="#00c8ff" />
      <!-- Orbital data marker -->
      <line x1="185" y1="-8" x2="185" y2="8" stroke="#00ff9c" stroke-width="1" />
    </g>
  </g>

  <!-- Orbital Ring 2: Secondary Cyan Ring (Tilted 60 deg, Counter-rotates) -->
  <g transform="translate(250, 250) rotate(58)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="175" ry="58" fill="none" stroke="url(#ringGrad2)" stroke-width="1.5" stroke-dasharray="120,8,40,8" />
      <circle cx="0" cy="58" r="3" fill="#00c8ff" />
      <circle cx="0" cy="-58" r="2" fill="#00ff9c" />
    </g>
  </g>

  <!-- Orbital Ring 3: Deep Orbital Outer Ring (Tilted -45 deg) -->
  <g transform="translate(250, 250) rotate(-45)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="195" ry="72" fill="none" stroke="#00ff9c" stroke-width="1" stroke-dasharray="6,12" opacity="0.5" />
      <circle cx="195" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Central Black Metallic Core Sphere -->
  <circle cx="250" cy="250" r="72" fill="url(#sphereCore)" stroke="#1a2e22" stroke-width="2" />
  
  <!-- Sphere Equatorial Seam -->
  <ellipse cx="250" cy="250" rx="72" ry="18" fill="none" stroke="#00ff9c" stroke-width="1.5" opacity="0.75" />
  <circle cx="250" cy="250" r="34" fill="#020503" stroke="#00ff9c" stroke-width="1.2" />

  <!-- Inner Glowing Core Symbol (HXNI Geometric Cipher) -->
  <g transform="translate(250, 250)" class="pulse-glow">
    <circle cx="0" cy="0" r="16" fill="#00ff9c" opacity="0.2" />
    <!-- H -->
    <path d="M -12 -8 L -12 8 M -7 -8 L -7 8 M -12 0 L -7 0" fill="none" stroke="#00ff9c" stroke-width="1.5" />
    <!-- X -->
    <path d="M -3 -8 L 3 8 M 3 -8 L -3 8" fill="none" stroke="#00c8ff" stroke-width="1.5" />
    <!-- N -->
    <path d="M 7 8 L 7 -8 L 13 8 L 13 -8" fill="none" stroke="#00ff9c" stroke-width="1.5" />
  </g>

  <!-- Floating Microscopic Data Particles -->
  <g class="dust">
    <circle cx="120" cy="180" r="1.5" fill="#00ff9c" opacity="0.6" />
    <circle cx="360" cy="150" r="1" fill="#00c8ff" opacity="0.5" />
    <circle cx="340" cy="340" r="1.8" fill="#00ff9c" opacity="0.7" />
    <circle cx="160" cy="320" r="1.2" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Bottom HUD Status Line -->
  <text x="250" y="445" text-anchor="middle" class="mono-label" font-size="9" letter-spacing="4px">● CIPHER CORE OPERATIONAL</text>
</svg>
